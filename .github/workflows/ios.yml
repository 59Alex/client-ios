name: iOS

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-linux:
    name: ConnectKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path Packages/ConnectKit

  ios-simulator:
    name: Build and UI tests (iOS Simulator)
    needs: package-linux
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: ConnectKit tests (macOS, includes Keychain store)
        run: swift test --package-path Packages/ConnectKit

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick simulator
        id: simulator
        run: echo "udid=$(scripts/pick-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Connect.xcodeproj \
            -scheme Connect \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath build/Connect.xcresult \
            | tee build-log.txt | grep -E "error:|warning:|Test Case|Executed|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-log.txt

      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -d build/Connect.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Connect.xcresult --output-path build/screenshots || true
          fi
          ls -la build/screenshots

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            build/screenshots
            build/Connect.xcresult
            build-log.txt
          retention-days: 14
